name: Release

# Push a tag that matches manifest.json's version (for example 1.0.0) to
# publish a GitHub release with the three files Obsidian installs.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG does not match manifest.json version $version"
            exit 1
          fi

      - name: Check main.js parses
        run: node --check main.js

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
